spring.application.name=SmartQR
#DB
spring.datasource.url=jdbc:mysql://localhost:3306/smartqr_database
spring.datasource.username=root
spring.datasource.password=${PASS_DB}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#JPA
spring.jpa.hibernate.ddl-auto=create
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
#MySQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=1800000
#OpenAI
spring.ai.model.chat=openai
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.chat.client.enabled=false
#Tools MCP
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=smartqr-admin-tools
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STATELESS
#Capabilities MCP
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
###HTTP MCP endpoint
spring.ai.mcp.server.stateless.mcp-endpoint=/mcp
spring.ai.mcp.server.stateless.disallow-delete=true
#ServerHealt
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
#SwaggerUI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
