spring.application.name=SmartQR

spring.datasource.url=jdbc:mysql://localhost:3306/smartqr_database

spring.datasource.username=root

spring.datasource.password=${PASS_DB}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



spring.jpa.hibernate.ddl-auto=create

spring.sql.init.mode=always

spring.jpa.defer-datasource-initialization=true



spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true



jwt.secret=smartqr-super-secret-key-100-montaditos-backend-bootcamp-2026



springdoc.api-docs.path=/api-docs

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.operationsSorter=method



spring.ai.openai.base-url=https://integrate.api.nvidia.com/v1

spring.ai.openai.chat.model=meta/llama-3.1-8b-instruct

spring.ai.openai.api-key=${NVIDIA_API_KEY}



management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=always

